name: SlowDown
options:
  bundleIdPrefix: com.futurerainbowlazer
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple developer team here (or in Xcode › Signing & Capabilities).
    DEVELOPMENT_TEAM: ""

targets:
  SlowDown-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
        excludes:
          - "*.plist"
          - "*.entitlements"
    dependencies:
      - target: SlowDownBroadcast
    settings:
      base:
        PRODUCT_NAME: SlowDown
        PRODUCT_BUNDLE_IDENTIFIER: com.futurerainbowlazer.slowdown
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: SlowDown
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: SlowDown uses the microphone to record music playing nearby so you can slow it down.
        CFBundleDocumentTypes: &documentTypes
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
              - public.mp3
              - public.mpeg-4-audio
              - com.apple.m4a-audio
              - com.microsoft.waveform-audio
              - public.aiff-audio
              - org.xiph.flac
              - com.apple.coreaudio-format
          - CFBundleTypeName: Movie
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.mpeg-4
              - com.apple.quicktime-movie
    entitlements:
      path: iOS/SlowDown-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.futurerainbowlazer.slowdown
    scheme: {}

  SlowDownBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Shared/Capture/CaptureFileWriter.swift
      - path: Shared/Support/StorageLocation.swift
    settings:
      base:
        PRODUCT_NAME: SlowDownBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: com.futurerainbowlazer.slowdown.Broadcast
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: BroadcastExtension/Info.plist
      properties:
        CFBundleDisplayName: SlowDown Capture
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: BroadcastExtension/SlowDownBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.futurerainbowlazer.slowdown

  SlowDown-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: macOS
        excludes:
          - "*.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: SlowDown
        PRODUCT_BUNDLE_IDENTIFIER: com.futurerainbowlazer.slowdown
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: SlowDown
        LSApplicationCategoryType: public.app-category.music
        NSMicrophoneUsageDescription: SlowDown uses the microphone to record music playing nearby so you can slow it down.
        NSAudioCaptureUsageDescription: SlowDown records the audio of the app you choose (for example YouTube in a browser, or Spotify) so you can slow it down.
        CFBundleDocumentTypes: *documentTypes
    entitlements:
      path: macOS/SlowDown-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.device.audio-input: true
    scheme: {}
