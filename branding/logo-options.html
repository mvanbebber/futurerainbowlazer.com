<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Options</title>
<style>
  :root { --bg: #f2f2f2; --card: #fff; --ink: #222; --muted: #666; --orange: #ff9a1f; --dark: #2b2b2b; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .card { background: var(--card); border-radius: 14px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size: 16px; margin: 0 0 2px; }
  .card .note { color: var(--muted); font-size: 13px; margin: 0 0 14px; min-height: 36px; }
  .hero { display: flex; justify-content: center; padding: 6px 0 14px; }
  .hero svg { width: 150px; height: 150px; }
  .sizes { display: flex; align-items: center; gap: 14px; justify-content: center; padding: 10px; border-radius: 10px; background: #e9e9e9; }
  .sizes.darkbg { background: #1c1c1c; margin-top: 8px; }
  .sizes svg:nth-child(1) { width: 16px; height: 16px; }
  .sizes svg:nth-child(2) { width: 32px; height: 32px; }
  .sizes svg:nth-child(3) { width: 60px; height: 60px; }
  .lockup { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .lockup svg { width: 40px; height: 40px; flex: none; }
  .word { font-weight: 800; font-size: 21px; letter-spacing: -.3px; }
  .word span { color: var(--orange); }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; background: var(--dark); color: #fff; border-radius: 6px; padding: 1px 7px; margin-right: 6px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- A: current favicon -->
    <symbol id="logo-a" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#2b2b2b"/>
      <g stroke="#ff9a1f" stroke-width="5" stroke-linecap="round">
        <line x1="12" y1="27" x2="12" y2="37"/><line x1="21" y1="20" x2="21" y2="44"/>
        <line x1="30" y1="13" x2="30" y2="51"/><line x1="39" y1="22" x2="39" y2="42"/>
      </g>
      <path d="M46 20 L56 32 L46 44" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- B: snail whose shell is a spiral -->
    <symbol id="logo-b" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#2b2b2b"/>
      <rect x="8" y="44" width="48" height="8" rx="4" fill="#ff9a1f"/>
      <rect x="8" y="33" width="8" height="19" rx="4" fill="#ff9a1f"/>
      <g stroke="#ff9a1f" stroke-width="2.5" stroke-linecap="round"><line x1="10" y1="34" x2="7" y2="24"/><line x1="14" y1="34" x2="17" y2="24"/></g>
      <circle cx="7" cy="23" r="2.4" fill="#ff9a1f"/><circle cx="17" cy="23" r="2.4" fill="#ff9a1f"/>
      <circle cx="37" cy="29" r="16" fill="#fff"/>
      <path d="M35 29 a2.5 2.5 0 1 1 5 0 a5 5 0 1 1 -10 0 a7.5 7.5 0 1 1 15 0 a10 10 0 1 1 -20 0" fill="none" stroke="#2b2b2b" stroke-width="2.6" stroke-linecap="round"/>
    </symbol>

    <!-- C: speed dial turned down to slow -->
    <symbol id="logo-c" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#2b2b2b"/>
      <path d="M12 42 A20 20 0 0 1 52 42" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round"/>
      <path d="M12 42 A20 20 0 0 1 18 28" fill="none" stroke="#ff9a1f" stroke-width="6" stroke-linecap="round"/>
      <line x1="32" y1="42" x2="17" y2="33" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="32" cy="42" r="5" fill="#fff"/>
      <g stroke="#ff9a1f" stroke-width="2.5" stroke-linecap="round">
        <line x1="22" y1="53" x2="22" y2="55"/><line x1="27" y1="51" x2="27" y2="57"/>
        <line x1="32" y1="50" x2="32" y2="58"/><line x1="37" y1="51" x2="37" y2="57"/><line x1="42" y1="53" x2="42" y2="55"/>
      </g>
    </symbol>

    <!-- D: waveform whose bars spread out (stretched in time) -->
    <symbol id="logo-d" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#ff9a1f"/>
      <g stroke="#2b2b2b" stroke-width="4" stroke-linecap="round">
        <line x1="9" y1="26" x2="9" y2="38"/><line x1="14" y1="18" x2="14" y2="46"/><line x1="19" y1="23" x2="19" y2="41"/>
        <line x1="25" y1="14" x2="25" y2="50"/><line x1="32" y1="21" x2="32" y2="43"/>
        <line x1="41" y1="17" x2="41" y2="47"/><line x1="54" y1="25" x2="54" y2="39"/>
      </g>
    </symbol>

    <!-- E: friendly buddy wearing headphones, mouth is a waveform -->
    <symbol id="logo-e" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#2b2b2b"/>
      <circle cx="32" cy="35" r="18" fill="#ff9a1f"/>
      <path d="M12 36 V31 a20 20 0 0 1 40 0 V36" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <rect x="8" y="30" width="8" height="14" rx="4" fill="#fff"/><rect x="48" y="30" width="8" height="14" rx="4" fill="#fff"/>
      <circle cx="25.5" cy="31" r="2.6" fill="#2b2b2b"/><circle cx="38.5" cy="31" r="2.6" fill="#2b2b2b"/>
      <path d="M23.5 38.5 Q32 48 40.5 38.5" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
    </symbol>

    <!-- F: music note inside a loop arrow -->
    <symbol id="logo-f" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#2b2b2b"/>
      <path d="M48 22 A19 19 0 1 0 51 36" fill="none" stroke="#ff9a1f" stroke-width="5" stroke-linecap="round"/>
      <path d="M41 21 L49 22 L50 14" fill="none" stroke="#ff9a1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M34 19 V38" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M34 19 q6 2 7 8" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="29.5" cy="39" rx="5.5" ry="4.3" transform="rotate(-20 29.5 39)" fill="#fff"/>
    </symbol>

    <!-- G: SDB monogram with a slow-motion trail -->
    <symbol id="logo-g" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#2b2b2b"/>
      <g stroke="#ff9a1f" stroke-width="3" stroke-linecap="round" opacity=".55"><line x1="9" y1="26" x2="14" y2="26"/><line x1="7" y1="32" x2="14" y2="32"/><line x1="9" y1="38" x2="14" y2="38"/></g>
      <text x="37" y="40" text-anchor="middle" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-weight="900" font-size="21" fill="#fff" letter-spacing="-1">SD<tspan fill="#ff9a1f">B</tspan></text>
    </symbol>
  </defs>
</svg>

<main>
  <h1>Slow Down Buddy logo options</h1>
  <p class="lead">Each option is shown large, at favicon and home-screen sizes on light and dark, and next to the name. Reply with a letter, or mix and match (for example, "E but with D's orange background").</p>
  <div class="grid" id="grid"></div>
</main>

<script>
  const options = [
    ['a', 'Waveform + play', 'The current favicon. Simple and reads well tiny, but generic.'],
    ['b', 'Snail', 'Slow, friendly and memorable; the spiral shell nods to looping.'],
    ['c', 'Speed dial', 'A gauge turned down to slow, with a little waveform underneath.'],
    ['d', 'Stretched wave', 'Bars spread apart left to right: sound stretched in time. Bold orange tile.'],
    ['e', 'Buddy', 'A smiling face in headphones. The most "buddy".'],
    ['f', 'Loop note', 'A music note inside a loop arrow: practice a passage over and over.'],
    ['g', 'SDB monogram', 'Initials with motion lines. Clean, but less descriptive.'],
  ];
  const use = (id) => `<svg><use href="#logo-${id}"/></svg>`;
  document.getElementById('grid').innerHTML = options.map(([id, name, note]) => `
    <div class="card">
      <h2><span class="tag">${id.toUpperCase()}</span>${name}</h2>
      <p class="note">${note}</p>
      <div class="hero">${use(id)}</div>
      <div class="sizes">${use(id)}${use(id)}${use(id)}</div>
      <div class="sizes darkbg">${use(id)}${use(id)}${use(id)}</div>
      <div class="lockup">${use(id)}<div class="word">Slow Down <span>Buddy</span></div></div>
    </div>`).join('');
</script>
</body>
</html>
